name: CI

# Roda a cada push e a cada Pull Request.
# O PR só deve ser integrado com este check verde.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    # O CI roda os testes sobre PostgreSQL (ADR 0004): serviço descartável por execução.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pratocheio
          POSTGRES_PASSWORD: pratocheio
          POSTGRES_DB: pratocheio
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pratocheio"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgres://pratocheio:pratocheio@localhost:5432/pratocheio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Criar o schema no PostgreSQL
        run: npm run db:migrar

      - name: Rodar os testes
        run: npm test

      - name: Verificar se a aplicação sobe
        run: |
          npm start &
          sleep 3
          curl --fail http://localhost:3000/api/saude
